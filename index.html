<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F97316" />
    <title>Smart VocabPlay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #fafafa; -webkit-text-size-adjust: 100%; }
      button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: inherit; }
      @keyframes vpFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.9; } }
      @keyframes vpPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes vpBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
