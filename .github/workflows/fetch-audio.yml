name: Fetch word audio

# ดาวน์โหลดเสียงเจ้าของภาษาจาก Wikimedia Commons แปลงเป็น mp3 แล้ว commit เข้า branch ที่สั่งรัน
# (เครื่องพัฒนาบางเครื่องต่อ Commons ไม่ได้ แต่ runner ของ GitHub ต่อได้)
on:
  push:
    paths:
      - scripts/fetch-audio.mjs
      - .github/workflows/fetch-audio.yml
  workflow_dispatch:
    inputs:
      force:
        description: "โหลดใหม่ทุกเสียง (ไม่ข้ามที่มีอยู่)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: node scripts/fetch-audio.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio src/audioManifest.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Add native-speaker word audio from Wikimedia Commons" && git pull --rebase --autostash origin ${{ github.ref_name }} && git push)
