name: Fetch sentence audio (neural TTS)

# สร้างเสียงอ่านจริงสำหรับประโยค/บทสนทนา/นิทาน/คำแปลไทย ด้วย edge-tts (ฟรี ไม่ต้องมี key) แล้ว commit เข้า branch ที่สั่งรัน
on:
  push:
    paths:
      - scripts/tts-list.mjs
      - scripts/fetch-tts.py
      - .github/workflows/fetch-tts.yml
      - src/lexicon.js
      - src/content.js
  workflow_dispatch:
    inputs:
      force:
        description: "สร้างใหม่ทุกไฟล์"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install edge-tts==7.0.2
      - run: node scripts/tts-list.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python3 -u scripts/fetch-tts.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tts src/ttsManifest.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "Add neural TTS audio for sentences, dialogues, stories and Thai meanings" && git pull --rebase --autostash origin ${{ github.ref_name }} && git push)
