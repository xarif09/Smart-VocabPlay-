<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VocabPlay" />
    <meta name="description" content="เกมฝึกคำศัพท์ภาษาอังกฤษสำหรับเด็กไทย คำอ่านไทย ประโยคตัวอย่าง พูดตาม เก็บดาว เลี้ยงเพื่อนคู่หู" />
    <title>Smart VocabPlay</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--md-surface, #fdf8ff); -webkit-text-size-adjust: 100%; font-family: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif; }
      /* พื้นหลังออโรรา: วงไล่สีนุ่มๆ ตรึงอยู่กับที่ */
      body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: none; }
      button { font-family: inherit; transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
      button:active { transform: scale(0.96); }
      input, select { font-family: inherit; }
      button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: inherit; }
      @keyframes vpFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.9; } }
      @keyframes vpPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes vpBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      /* ── FX layer ── */
      @keyframes vpInUp { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: none; } }
      @keyframes vpInLeft { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
      @keyframes vpInScale { from { opacity: 0; transform: scale(.7); } 70% { transform: scale(1.06); } to { opacity: 1; transform: none; } }
      @keyframes vpBreathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.04); } }
      @keyframes vpBlink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      @keyframes vpShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
      @keyframes vpGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,209,102,.0), 0 18px 44px rgba(30,27,75,.16); } 50% { box-shadow: 0 0 0 10px rgba(255,209,102,.18), 0 18px 54px rgba(109,93,252,.35); } }
      @keyframes vpAurora { 0% { transform: translate(0,0) rotate(0deg) scale(1); } 33% { transform: translate(4%,-3%) rotate(8deg) scale(1.08); } 66% { transform: translate(-3%,4%) rotate(-6deg) scale(1.04); } 100% { transform: translate(0,0) rotate(0deg) scale(1); } }
      @keyframes vpSpin { to { transform: rotate(360deg); } }
      @keyframes vpStarPop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.5) rotate(10deg); opacity: 1; } 80% { transform: scale(.9) rotate(-4deg); } 100% { transform: scale(1) rotate(0); } }
      @keyframes vpWiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.05); } 75% { transform: rotate(6deg) scale(1.05); } }
      @keyframes vpFloatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .vp-aurora { position: fixed; inset: -20%; z-index: -1; pointer-events: none; filter: blur(60px); opacity: .9;
        background:
          radial-gradient(40% 35% at 20% 15%, rgba(168,85,247,.45), transparent 70%),
          radial-gradient(35% 35% at 85% 20%, rgba(255,111,174,.4), transparent 70%),
          radial-gradient(45% 40% at 55% 95%, rgba(34,211,238,.35), transparent 70%),
          radial-gradient(30% 30% at 10% 80%, rgba(255,209,102,.3), transparent 70%);
        animation: vpAurora 28s ease-in-out infinite; }
      .vp-shimmer { background-image: linear-gradient(110deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 70%); background-size: 200% 100%; animation: vpShimmer 2.4s linear infinite; }
      .vp-glass { background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid rgba(255,255,255,.85); }
      .vp-card-hover { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
      .vp-card-hover:active { transform: scale(.96) !important; }
      @media (hover:hover) { .vp-card-hover:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 22px 50px rgba(30,27,75,.2) !important; } }
      @media (prefers-reduced-motion: reduce) { .vp-aurora, .vp-shimmer { animation: none !important; } }
      /* ── ทรานซิชันระหว่างหน้า ── */
      @keyframes vpPage { from { opacity: 0; transform: translateY(14px) scale(.995); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes vpZoomIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
      /* ── ธีม (ซื้อในร้าน) ── */
      /* สีธีม: ตั้งโดย applyM3Theme() ใน src/m3.jsx (Material 3 dynamic color) */
      body { background: var(--md-surface, #fdf8ff); color: var(--md-on-surface, #1d1b20); transition: background .4s; }
      [data-dark="1"] .vp-aurora { opacity: .35; }
      .vp-aurora { opacity: .5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
